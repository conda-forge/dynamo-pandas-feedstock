{% set name = "dynamo-pandas" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/dynamo-pandas-{{ version }}.tar.gz
  sha256: d24d30712d2ba853885cbe40dfea45dbba93231dc08eb309cff4a2b919ec7ac8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - pandas >=1
    - boto3

test:
  imports:
    - dynamo_pandas
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/DrGFreeman/dynamo-pandas
  summary: Make working with pandas dataframe and AWS DynamoDB easy.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - raybellwaves
