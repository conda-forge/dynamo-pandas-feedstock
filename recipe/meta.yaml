{% set name = "dynamo-pandas" %}
{% set version = "1.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b381493bf36527c6b7fd7efd883b89efd5b14f60f6097fb652217eac28451256

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - pandas >=1
    - boto3

test:
  imports:
    - dynamo_pandas
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/DrGFreeman/dynamo-pandas
  summary: Make working with pandas dataframe and AWS DynamoDB easy.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - raybellwaves
